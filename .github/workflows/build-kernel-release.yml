name: Build and Release OnePlus ZSU Kernels

on:
  workflow_dispatch:
    inputs:
      config_path:
        description: 'Exact configs/**/*.json path; empty builds selected OS/kernel group'
        type: string
        default: ''
      retry_of_run:
        description: 'Completed same-repository run ID; retry only its failed/timed-out kernel jobs'
        type: string
        default: ''
      reuse_runs:
        description: 'Comma-separated completed same-repository run IDs whose successful target jobs may be reused (max 8)'
        type: string
        default: ''
      selector:
        description: 'Device group when config_path is empty'
        type: choice
        options: [OOS16, OOS15, OOS14, OOS15+OOS16, all, android12-5.10, android13-5.15, android14-6.1, android15-6.6, android16-6.12]
        default: OOS16
      make_release:
        description: 'Publish only if every selected kernel built and ZIP validation passed'
        type: boolean
        default: false
      release_tag:
        description: 'New release tag; never overwrites an existing release'
        type: string
        default: 'v2.3.0-zsu-all-r1'
      prerelease:
        description: 'Experimental / not hardware boot-tested (keep true for initial builds)'
        type: boolean
        default: true
      debug:
        description: 'Upload compile logs/config for failed builds'
        type: boolean
        default: true
      optimize_level:
        type: choice
        description: 'Compiler optimization level'
        options: [O2, O3]
        default: O2

permissions:
  contents: read
  actions: read

concurrency:
  group: zsu-kernel-${{ github.ref }}-${{ inputs.retry_of_run || 'base' }}-${{ inputs.config_path || inputs.selector }}-${{ inputs.reuse_runs || 'none' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
      retry_count: ${{ steps.matrix.outputs.retry_count }}
      zsu_commit: ${{ steps.lock.outputs.zsu_commit }}
      parent_run_id: ${{ steps.matrix.outputs.parent_run_id }}
      parent_head_sha: ${{ steps.matrix.outputs.parent_head_sha }}
      parent_success_count: ${{ steps.matrix.outputs.parent_success_count }}
      retained_success_count: ${{ steps.matrix.outputs.retained_success_count }}
      retained_runs: ${{ steps.matrix.outputs.retained_runs }}
      release_only: ${{ steps.matrix.outputs.release_only }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository contracts
        run: python3 scripts/test_pipeline.py
      - name: Resolve locked source identity
        id: lock
        run: echo "zsu_commit=$(jq -r .zsu_commit sources.lock.json)" >> "$GITHUB_OUTPUT"
      - name: Validate aggregate retry release contract
        if: ${{ (inputs.retry_of_run != '' || inputs.reuse_runs != '') && inputs.make_release }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$RELEASE_TAG" != 'v2.3.0-zsu-all-r1' ]; then
            echo '::error::Aggregate retries must publish v2.3.0-zsu-all-r1'
            exit 1
          fi
          if [ "$PRERELEASE" != 'true' ]; then
            echo '::error::Aggregate retry publication must remain a prerelease'
            exit 1
          fi
      - name: Select exact device configurations
        id: matrix
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
          SELECTOR: ${{ inputs.selector }}
          RETRY_OF_RUN: ${{ inputs.retry_of_run }}
          REUSE_RUNS: ${{ inputs.reuse_runs }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/select_configs.py

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.release_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: ${{ matrix.model }} / ${{ matrix.os_version }} / ${{ matrix.kernel_version }}
    env:
      GH_TOKEN: ${{ github.token }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 4G
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_COMPRESSION: 'true'
      CCACHE_SLOPPINESS: 'file_macro,time_macros,include_file_mtime,include_file_ctime'
      CCACHE_LOGFILE: ${{ github.workspace }}/ccache.log
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        uses: ./.github/actions/disk-cleanup
      - name: Install build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential clang lld flex bison libelf-dev \
            libssl-dev libncurses-dev zlib1g-dev liblz4-tool libxml2-utils rsync unzip zip \
            dwarves file python3 python3-requests ccache jq bc dos2unix kmod libdw-dev elfutils pigz aria2 zstd
          sudo apt-get clean
          mkdir -p "$CCACHE_DIR"
      - uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: zsu-${{ needs.prepare.outputs.zsu_commit }}-${{ matrix.model }}-${{ matrix.os_version }}-${{ github.run_id }}
          restore-keys: zsu-${{ needs.prepare.outputs.zsu_commit }}-${{ matrix.model }}-${{ matrix.os_version }}-
      - name: Prepare build config
        id: config
        env:
          MATRIX_JSON: ${{ toJSON(matrix) }}
        run: echo "json=$(jq -c 'del(.config_path,.susfs_commit)' <<< "$MATRIX_JSON")" >> "$GITHUB_OUTPUT"
      - name: Build kernel with ZSU and upstream features
        id: kernel
        uses: ./.github/actions/build-kernel
        with:
          op_config_json: ${{ steps.config.outputs.json }}
          ksu_type: ZSU
          ksu_branch_or_hash: ${{ needs.prepare.outputs.zsu_commit }}
          susfs_commit_hash_or_branch: ${{ matrix.susfs_commit }}
          optimize_level: ${{ inputs.optimize_level }}
          clean: false
          debug: ${{ inputs.debug }}
          github_token: ${{ github.token }}
      - name: Collect failure diagnostics without traversing vendor symlinks
        if: failure()
        shell: bash
        run: |
          mkdir -p failure-diagnostics
          for file in "$COMMON_KERNEL_FOLDER/build.log" "$COMMON_KERNEL_FOLDER/out/.config"; do
            if [ -f "$file" ]; then cp "$file" failure-diagnostics/; fi
          done
      - name: Upload failure log and generated configuration
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-${{ matrix.model }}-${{ matrix.os_version }}
          path: failure-diagnostics/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  release:
    needs: [prepare, build]
    if: ${{ always() && inputs.make_release && (needs.build.result == 'success' || needs.prepare.outputs.release_only == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      PRERELEASE: ${{ inputs.prerelease }}
      EXPECTED_COUNT: ${{ needs.prepare.outputs.count }}
      RETRY_OF_RUN: ${{ inputs.retry_of_run }}
      RETRY_COUNT: ${{ needs.prepare.outputs.retry_count }}
      PARENT_RUN_ID: ${{ needs.prepare.outputs.parent_run_id }}
      PARENT_HEAD_SHA: ${{ needs.prepare.outputs.parent_head_sha }}
      PARENT_SUCCESS_COUNT: ${{ needs.prepare.outputs.parent_success_count }}
      PARENT_COUNT: ${{ needs.prepare.outputs.count }}
      RETAINED_SUCCESS_COUNT: ${{ needs.prepare.outputs.retained_success_count }}
      RETAINED_RUNS: ${{ needs.prepare.outputs.retained_runs }}
    steps:
      - uses: actions/checkout@v4
      - name: Create clean release assembly directories
        run: rm -rf release-assets retry-assets && mkdir -p release-assets
      - name: Download successful archives retained by parent and reusable runs
        if: ${{ inputs.retry_of_run != '' && needs.prepare.outputs.retained_success_count != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_download.py \
            --runs-json "$RETAINED_RUNS" \
            --destination release-assets \
            --expected-count "$RETAINED_SUCCESS_COUNT"
      - name: Download archives from this retry matrix
        if: ${{ inputs.retry_of_run != '' && needs.prepare.outputs.retry_count != '0' }}
        uses: actions/download-artifact@v4
        with:
          pattern: AK3_*
          path: retry-assets
          merge-multiple: true
      - name: Flatten retry archives over retained archives
        if: ${{ inputs.retry_of_run != '' && needs.prepare.outputs.retry_count != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_download.py \
            --flatten-from retry-assets \
            --destination release-assets \
            --expected-count "$RETRY_COUNT"
      - name: Download archives from this normal build
        if: ${{ inputs.retry_of_run == '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: AK3_*
          path: release-assets
          merge-multiple: true
      - name: Validate real artifacts and generate release notes
        run: python3 scripts/prepare_release.py
      - name: Publish newly compiled kernels
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo '::error::Release already exists; choose a new tag'
            exit 1
          fi
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --target "$GITHUB_SHA" --title "OnePlus ZSU + SUSFS ${RELEASE_TAG}" \
            --notes-file release-notes.md "${flags[@]}"
