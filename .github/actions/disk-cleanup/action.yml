name: Disk Cleanup
description: Free ephemeral GitHub runner disk space without racing apt or removing action runtimes
runs:
  using: composite
  steps:
    - name: Remove unused SDKs on the ephemeral build runner
      shell: bash
      run: |
        set -euo pipefail
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /opt/hostedtoolcache/CodeQL /usr/local/share/chromium /usr/local/lib/heroku
        sudo apt-get clean
        df -h "$GITHUB_WORKSPACE"
